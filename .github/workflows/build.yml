name: Build Droidspaces kernel (sagit)

on:
  workflow_dispatch:
  push:
    branches: [ droidspaces-14.0 ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq wget gnupg lsb-release software-properties-common curl \
            bc bison flex libssl-dev libncurses-dev cpio lz4 xz-utils zip \
            python3 build-essential ca-certificates git \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && ./llvm.sh 17
          apt-get install -y -qq clang-17 lld-17
          clang-17 --version | head -1

      - name: Build kernel
        run: bash droidspaces/build-kernel.sh

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cp droidspaces/anykernel.sh ak3/
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          rm -rf ak3/.git ak3/.github ak3/README.md
          cd ak3 && zip -qr9 ../droidspaces-sagit-${GITHUB_SHA::7}.zip \
            anykernel.sh tools META-INF Image.gz-dtb modules patch ramdisk -x "*.git*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-sagit
          path: droidspaces-sagit-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: droidspaces-sagit-*.zip
